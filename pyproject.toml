# Ferramentas do autor e de colaboradores.
# Este arquivo não define um pacote Python instalável.
# Os exemplos do livro devem permanecer executáveis com a biblioteca padrão.

[tool.ruff]
required-version = "0.17.1"
target-version = "py313"
line-length = 100
include = ["*.py"]
extend-exclude = [".venv", ".git"]

[tool.ruff.lint]
# Defeitos objetivos: importação, comandos, erros de execução e nomes indefinidos.
# Comprimento de linha, tipagem, docstrings e avisos de estilo ficam de fora
# para preservar a leitura dos exemplos introdutórios.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
